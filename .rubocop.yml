# Omakase Ruby styling for Rails
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  # Exclude:
  #   - 'bin/*'
  #   - 'db/schema.rb'
  #   - 'spec/**/*'
  NewCops: enable

Bundler/OrderedGems:
  Enabled: false

